name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege by default; jobs ask for more only where they need it.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm exec tsc --noEmit
      - run: pnpm build

  # Builds the image; on main also publishes ghcr.io/<org>/dreamlab-web:sha-<short> and :main.
  docker:
    runs-on: ubuntu-latest
    needs: check
    permissions:
      contents: read
      packages: write
    env:
      PUBLISH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - if: env.PUBLISH == 'true'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: names
        run: |
          image="ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/dreamlab-web"
          echo "tags=${image}:sha-${GITHUB_SHA::7},${image}:main" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          build-args: NEXT_PUBLIC_GOOGLE_CLIENT_ID=${{ vars.GOOGLE_CLIENT_ID }}
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ env.PUBLISH == 'true' && steps.names.outputs.tags || 'dreamlab-web:ci' }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Roll the new images out to staging on Azure. Signs in to Azure with OIDC (no stored secret) as
  # github-dreamlab-deploy, which may only run commands on the Dream Lab VMs; the image pull uses
  # this job's short-lived GITHUB_TOKEN. Production is deployed from dreamlab-infra, with approval.
  deploy-staging:
    runs-on: ubuntu-latest
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.AZURE_DEPLOY_CLIENT_ID != ''
    concurrency: deploy-staging-${{ github.repository }}
    permissions:
      id-token: write
      contents: read
      packages: read
    steps:
      - uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          client-id: ${{ vars.AZURE_DEPLOY_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy to staging
        env:
          RG: ${{ vars.AZURE_RESOURCE_GROUP }}
          PULL_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Runs finish out of order; never let an older commit replace a newer one on staging.
          head=$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)
          if [ "$head" != "$GITHUB_SHA" ]; then echo "main has moved on to ${head::7}; skipping this deploy."; exit 0; fi
          tag="sha-${GITHUB_SHA::7}"
          for svc in web; do
            vm=$svc; [ "$svc" = init-db ] && vm=iam
            echo "::group::$svc on vm-dreamlab-$vm"
            # The VM runs its installed deploy script (dreamlab-infra is private).
            out=$(az vm run-command invoke -g "$RG" -n "vm-dreamlab-$vm" --command-id RunShellScript \
              --scripts "/opt/dreamlab/infra/azure/vm/deploy.sh $svc staging $tag local $PULL_TOKEN" \
              --query "value[0].message" -o tsv)
            echo "$out"
            echo "::endgroup::"
            grep -q DEPLOY_OK <<<"$out" || { echo "::error::$svc failed to deploy"; exit 1; }
          done
